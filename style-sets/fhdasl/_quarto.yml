project:
  type: book

book:
  title: "FHDaSL Book Name"
  favicon: assets/favicon.ico
  bread-crumbs: false
  chapters:
    - index.qmd
  sidebar:
    logo: assets/big-dasl-stacked.png
    logo-href: https://ottrproject.org/
  page-footer:
    left: |
      This content was published with <a href="https://quarto.org/" target="_blank">Quarto</a> using
      <a href="https://github.com/ottrproject/OTTR_Quarto" target="_blank">OTTR</a>.
    center: |
      The OTTR Template by <a href="https://github.com/ottrproject/OTTR_Template" target="_blank">The Fred Hutch Data Science Lab</a>.
    right: |
      <a href="https://forms.gle/W6Mg4rzuMK6Yk3Am8" target="_blank">Click here to provide feedback</a>

bibliography:
  - book.bib
  - packages.bib
link-citations: true

format:
  html:
    css: assets/style.css
    include-before-body: assets/big-image_fhdasl.html
    include-after-body: assets/footer.html
    highlight-style: tango
    toc: true
    sidebar: true
    code-copy: true
    code-link: true
    link-external-newwindow: true
    theme: cosmo
